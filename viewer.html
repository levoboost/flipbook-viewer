<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Flipbook Viewer</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #111;
    color: #eee;
    font-family: system-ui, Segoe UI, Roboto, Arial;
    overflow: hidden;
  }
  header {
    padding: 10px 14px;
    background: #111;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid #222;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #title {
    font-size: 16px;
    opacity: .85;
  }
  #header-controls {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .control-btn {
    background: #333;
    border: 1px solid #555;
    color: #eee;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
    transition: background 0.2s;
  }
  .control-btn:hover { background: #444; }
  .control-btn:active { background: #555; }
  
  #wrap {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    height: calc(100dvh - 52px);
    padding: 10px;
    overflow: auto;
  }
  #zoom-container {
    transform-origin: top center;
    transition: transform 0.3s ease;
    margin: 20px 0;
  }
  
  #book-container {
    width: 1000px;
    height: 1413px;
    position: relative;
    perspective: 2000px;
    background: #222;
  }
  
  .page {
    position: absolute;
    width: 500px;
    height: 1413px;
    background-size: cover;
    background-position: center;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
  }
  
  .page-left {
    left: 0;
    transform-origin: right center;
  }
  
  .page-right {
    right: 0;
    transform-origin: left center;
  }
  
  .page.flipping {
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 10;
  }
  
  .page.flip-forward {
    transform: rotateY(-180deg);
  }
  
  .page.flip-backward {
    transform: rotateY(180deg);
  }
  
  .hint {
    position: fixed;
    bottom: 10px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 12px;
    color: #aaa;
    z-index: 1;
    background: rgba(0,0,0,0.7);
    padding: 5px;
  }
  
  #loader {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.8);
    padding: 20px;
    border-radius: 8px;
    color: white;
    z-index: 1000;
  }
  
  .zoom-controls {
    display: flex;
    gap: 5px;
    align-items: center;
  }
  
  .zoom-btn {
    background: #333;
    border: 1px solid #555;
    color: #eee;
    width: 30px;
    height: 30px;
    border-radius: 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
  }
  
  .zoom-btn:hover { background: #444; }
  .zoom-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  
  .error-message {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.8);
    padding: 20px;
    border-radius: 8px;
    color: #e66;
    z-index: 1000;
    text-align: center;
  }
  
  .click-area {
    position: absolute;
    top: 0;
    width: 50%;
    height: 100%;
    cursor: pointer;
    z-index: 5;
  }
  
  .click-area-left { left: 0; }
  .click-area-right { right: 0; }
</style>
</head>
<body>
<header>
  <span id="title">Flipbook</span>
  <div id="header-controls">
    <div class="zoom-controls">
      <button class="zoom-btn" id="zoomOut" title="Zoom Out">-</button>
      <span id="zoomLevel" style="color:#eee; font-size:12px; min-width:40px; text-align:center;">50%</span>
      <button class="zoom-btn" id="zoomIn" title="Zoom In">+</button>
    </div>
    <button class="control-btn" id="downloadBtn" title="Descargar PDF">📥 Descargar</button>
  </div>
</header>
<div id="wrap">
  <div id="zoom-container">
    <div id="book-container">
      <div class="click-area click-area-left"></div>
      <div class="click-area click-area-right"></div>
    </div>
  </div>
</div>
<div class="hint">Usa ← → o clic en los bordes para pasar página. Scroll para navegar en zoom.</div>
<div id="loader">Cargando PDF...</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function() {
  const params = new URLSearchParams(location.search);
  const pdfUrl = params.get('src');
  const docTitle = params.get('title') || 'Documento';
  document.getElementById('title').textContent = '📖 ' + docTitle;

  if (!pdfUrl) {
    document.getElementById('loader').innerHTML = '<div class="error-message">Falta el parámetro <code>src</code> con la URL del PDF.</div>';
    return;
  }

  const container = document.getElementById('book-container');
  const zoomContainer = document.getElementById('zoom-container');
  const wrap = document.getElementById('wrap');
  const loader = document.getElementById('loader');
  
  let currentZoom = 0.5;
  const ZOOM_STEP = 0.25;
  const MIN_ZOOM = 0.5;
  const MAX_ZOOM = 3.0;
  
  let allImages = [];
  let currentPage = 0;
  let isFlipping = false;

  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  function applyZoom() {
    zoomContainer.style.transform = `scale(${currentZoom})`;
    updateZoomDisplay();
    setTimeout(() => wrap.scrollTop = 0, 100);
  }

  function setupZoomControls() {
    document.getElementById('zoomIn').addEventListener('click', () => {
      if (currentZoom < MAX_ZOOM) {
        currentZoom = Math.min(MAX_ZOOM, currentZoom + ZOOM_STEP);
        currentZoom = Math.round(currentZoom * 100) / 100;
        applyZoom();
      }
    });

    document.getElementById('zoomOut').addEventListener('click', () => {
      if (currentZoom > MIN_ZOOM) {
        currentZoom = Math.max(MIN_ZOOM, currentZoom - ZOOM_STEP);
        currentZoom = Math.round(currentZoom * 100) / 100;
        applyZoom();
      }
    });

    document.getElementById('zoomLevel').addEventListener('dblclick', () => {
      currentZoom = 0.5;
      applyZoom();
    });
  }

  function updateZoomDisplay() {
    document.getElementById('zoomLevel').textContent = Math.round(currentZoom * 100) + '%';
    document.getElementById('zoomIn').disabled = currentZoom >= MAX_ZOOM;
    document.getElementById('zoomOut').disabled = currentZoom <= MIN_ZOOM;
  }

  function setupDownloadButton() {
    const downloadBtn = document.getElementById('downloadBtn');
    
    downloadBtn.addEventListener('click', async () => {
      try {
        downloadBtn.textContent = '⏳ Descargando...';
        downloadBtn.disabled = true;
        
        const response = await fetch(pdfUrl);
        if (!response.ok) throw new Error('Error en la descarga');
        const blob = await response.blob();
        
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = "Informe_Estrategico_IA_Comercial.pdf";
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        document.body.removeChild(a);
        
        downloadBtn.textContent = '✅ Descargado';
        setTimeout(() => {
          downloadBtn.textContent = '📥 Descargar';
          downloadBtn.disabled = false;
        }, 2000);
        
      } catch (error) {
        console.error('Error al descargar:', error);
        downloadBtn.textContent = '❌ Error';
        setTimeout(() => {
          downloadBtn.textContent = '📥 Descargar';
          downloadBtn.disabled = false;
        }, 2000);
        alert('Error al descargar el PDF. Puede intentar descargarlo directamente desde: ' + pdfUrl);
      }
    });
  }

  function renderPages() {
    container.querySelectorAll('.page').forEach(p => p.remove());
    
    const leftIdx = currentPage;
    const rightIdx = currentPage + 1;
    
    if (leftIdx >= 0 && leftIdx < allImages.length) {
      const leftPage = document.createElement('div');
      leftPage.className = 'page page-left';
      leftPage.style.backgroundImage = `url(${allImages[leftIdx]})`;
      container.appendChild(leftPage);
    }
    
    if (rightIdx < allImages.length) {
      const rightPage = document.createElement('div');
      rightPage.className = 'page page-right';
      rightPage.style.backgroundImage = `url(${allImages[rightIdx]})`;
      container.appendChild(rightPage);
    }
  }

  function flipNext() {
    if (isFlipping || currentPage >= allImages.length - 2) return;
    isFlipping = true;
    
    const rightPage = container.querySelector('.page-right');
    if (rightPage) {
      rightPage.classList.add('flipping', 'flip-forward');
      
      setTimeout(() => {
        currentPage += 2;
        renderPages();
        isFlipping = false;
      }, 600);
    }
  }

  function flipPrev() {
    if (isFlipping || currentPage <= 0) return;
    isFlipping = true;
    
    currentPage -= 2;
    renderPages();
    
    setTimeout(() => {
      const rightPage = container.querySelector('.page-right');
      if (rightPage) {
        rightPage.style.transform = 'rotateY(180deg)';
        rightPage.classList.add('flipping');
        
        setTimeout(() => {
          rightPage.style.transform = 'rotateY(0deg)';
          setTimeout(() => {
            isFlipping = false;
          }, 600);
        }, 50);
      } else {
        isFlipping = false;
      }
    }, 50);
  }

  pdfjsLib.getDocument(pdfUrl).promise.then(async (pdf) => {
    const total = pdf.numPages;
    
    const renderPage = async (num) => {
      const page = await pdf.getPage(num);
      const viewport = page.getViewport({ scale: 1.5 });
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = viewport.width; 
      canvas.height = viewport.height;
      
      await page.render({ canvasContext: ctx, viewport: viewport }).promise;
      return canvas.toDataURL('image/png');
    };

    try {
      loader.textContent = 'Cargando páginas...';
      
      for (let i = 1; i <= total; i++) {
        loader.textContent = `Cargando página ${i} de ${total}...`;
        const img = await renderPage(i);
        allImages.push(img);
      }

      renderPages();
      setupZoomControls();
      setupDownloadButton();
      applyZoom();
      loader.style.display = 'none';

      document.querySelector('.click-area-left').addEventListener('click', flipPrev);
      document.querySelector('.click-area-right').addEventListener('click', flipNext);

      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') {
          e.preventDefault();
          flipNext();
        }
        else if (e.key === 'ArrowLeft') {
          e.preventDefault();
          flipPrev();
        }
        else if ((e.key === '+' || e.key === '=') && !e.ctrlKey) {
          e.preventDefault();
          if (currentZoom < MAX_ZOOM) {
            currentZoom = Math.min(MAX_ZOOM, currentZoom + ZOOM_STEP);
            currentZoom = Math.round(currentZoom * 100) / 100;
            applyZoom();
          }
        }
        else if ((e.key === '-' || e.key === '_') && !e.ctrlKey) {
          e.preventDefault();
          if (currentZoom > MIN_ZOOM) {
            currentZoom = Math.max(MIN_ZOOM, currentZoom - ZOOM_STEP);
            currentZoom = Math.round(currentZoom * 100) / 100;
            applyZoom();
          }
        }
        else if (e.key === '0' && !e.ctrlKey) {
          currentZoom = 0.5;
          applyZoom();
        }
      });

      container.addEventListener('dblclick', (e) => {
        e.preventDefault();
        currentZoom = 0.5;
        applyZoom();
      });

      updateZoomDisplay();

    } catch (error) {
      loader.innerHTML = '<div class="error-message"><h3>No ha podido cargarse el documento</h3></div>';
      console.error('Error:', error);
    }
  }).catch(err => {
    loader.innerHTML = '<div class="error-message"><h3>No ha podido cargarse el documento</h3></div>';
    console.error('PDF Error:', err);
  });
})();
</script>
</body>
</html>
