<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Flipbook Viewer</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/css/page-flip.css" />
<style>
  body {
    margin: 0;
    background: #111;
    color: #eee;
    font-family: system-ui, Segoe UI, Roboto, Arial;
  }
  header {
    padding: 10px 14px;
    background: #111;
    position: sticky;
    top: 0;
    z-index: 2;
    border-bottom: 1px solid #222;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #title {
    font-size: 16px;
    opacity: .85;
  }
  #header-controls {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .control-btn {
    background: #333;
    border: 1px solid #555;
    color: #eee;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
    transition: background 0.2s;
  }
  .control-btn:hover {
    background: #444;
  }
  .control-btn:active {
    background: #555;
  }
  #wrap {
    display: flex;
    justify-content: center;
    align-items: stretch;
    height: calc(100dvh - 52px);
    padding: 10px;
  }
  #book {
    width: min(100%, 1200px);
    height: 100%;
  }
  .hint {
    position: fixed;
    bottom: 10px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 12px;
    color: #aaa;
  }
  #loader {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.8);
    padding: 20px;
    border-radius: 8px;
    color: white;
    z-index: 1000;
  }
  .zoom-controls {
    display: flex;
    gap: 5px;
    align-items: center;
  }
  .zoom-btn {
    background: #333;
    border: 1px solid #555;
    color: #eee;
    width: 30px;
    height: 30px;
    border-radius: 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
  }
  .zoom-btn:hover {
    background: #444;
  }
  .zoom-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
</style>
</head>
<body>
<header>
  <span id="title">Flipbook</span>
  <div id="header-controls">
    <div class="zoom-controls">
      <button class="zoom-btn" id="zoomOut" title="Zoom Out">-</button>
      <span id="zoomLevel" style="color:#eee; font-size:12px; min-width:40px; text-align:center;">100%</span>
      <button class="zoom-btn" id="zoomIn" title="Zoom In">+</button>
    </div>
    <button class="control-btn" id="downloadBtn" title="Descargar PDF">📥 Descargar</button>
  </div>
</header>
<div id="wrap"><div id="book"></div></div>
<div class="hint">Usa ← → o clic para pasar página. Controles de zoom arriba.</div>
<div id="loader">Cargando PDF...</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
<script>
(function() {
  // Lee ?src= (PDF) y ?title= del querystring
  const params = new URLSearchParams(location.search);
  const pdfUrl = params.get('src');
  const docTitle = params.get('title') || 'Documento';
  document.getElementById('title').textContent = '📖 ' + docTitle;

  if (!pdfUrl) {
    document.getElementById('book').innerHTML =
      '<div style="padding:2rem">Falta el parámetro <code>src</code> con la URL del PDF.</div>';
    document.getElementById('loader').style.display = 'none';
    return;
  }

  const container = document.getElementById('book');
  const loader = document.getElementById('loader');
  let flip; // Declarar flip aquí para acceso global
  
  // Variables para control de zoom
  let currentZoom = 1;
  const ZOOM_STEP = 0.2;
  const MIN_ZOOM = 0.5;
  const MAX_ZOOM = 3.0;

  // Configurar PDF.js
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  // Array para almacenar todas las imágenes
  let allImages = [];

  // Función para aplicar zoom
  function applyZoom() {
    if (!flip) return;
    
    console.log('Aplicando zoom:', currentZoom);
    
    // Actualizar el tamaño basado en el zoom
    const baseWidth = 800;
    const baseHeight = 1130;
    
    const newWidth = Math.round(baseWidth * currentZoom);
    const newHeight = Math.round(baseHeight * currentZoom);
    
    console.log('Nuevo tamaño:', newWidth, 'x', newHeight);
    
    // Forzar actualización del tamaño del contenedor
    container.style.width = newWidth + 'px';
    container.style.height = newHeight + 'px';
    
    // Actualizar el flipbook
    flip.update();
    
    updateZoomDisplay();
  }

  // Función para manejar el zoom
  function setupZoomControls() {
    const zoomIn = document.getElementById('zoomIn');
    const zoomOut = document.getElementById('zoomOut');

    zoomIn.addEventListener('click', () => {
      if (currentZoom < MAX_ZOOM) {
        currentZoom = Math.min(MAX_ZOOM, currentZoom + ZOOM_STEP);
        currentZoom = Math.round(currentZoom * 10) / 10; // Redondear a 1 decimal
        applyZoom();
      }
    });

    zoomOut.addEventListener('click', () => {
      if (currentZoom > MIN_ZOOM) {
        currentZoom = Math.max(MIN_ZOOM, currentZoom - ZOOM_STEP);
        currentZoom = Math.round(currentZoom * 10) / 10; // Redondear a 1 decimal
        applyZoom();
      }
    });

    // También permitir reset con doble clic en el indicador de zoom
    const zoomLevel = document.getElementById('zoomLevel');
    zoomLevel.addEventListener('dblclick', () => {
      currentZoom = 1;
      applyZoom();
    });
  }

  // Función para actualizar la visualización del zoom
  function updateZoomDisplay() {
    const zoomLevel = document.getElementById('zoomLevel');
    zoomLevel.textContent = Math.round(currentZoom * 100) + '%';
    
    // Actualizar estado de botones
    document.getElementById('zoomIn').disabled = currentZoom >= MAX_ZOOM;
    document.getElementById('zoomOut').disabled = currentZoom <= MIN_ZOOM;
  }

  // Función para descargar el PDF
  function setupDownloadButton() {
    const downloadBtn = document.getElementById('downloadBtn');
    
    downloadBtn.addEventListener('click', async () => {
      try {
        downloadBtn.textContent = '⏳ Descargando...';
        downloadBtn.disabled = true;
        
        // Descargar el archivo PDF original
        const response = await fetch(pdfUrl);
        if (!response.ok) throw new Error('Error en la descarga');
        const blob = await response.blob();
        
        // Crear enlace de descarga
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        
        // Usar nombre fijo sin acentos
        const fileName = "Informe_Estrategico_IA_Comercial.pdf";
        
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        document.body.removeChild(a);
        
        downloadBtn.textContent = '✅ Descargado';
        setTimeout(() => {
          downloadBtn.textContent = '📥 Descargar';
          downloadBtn.disabled = false;
        }, 2000);
        
      } catch (error) {
        console.error('Error al descargar:', error);
        downloadBtn.textContent = '❌ Error';
        setTimeout(() => {
          downloadBtn.textContent = '📥 Descargar';
          downloadBtn.disabled = false;
        }, 2000);
        
        alert('Error al descargar el PDF. Puede intentar descargarlo directamente desde: ' + pdfUrl);
      }
    });
  }

  // Carga y renderiza páginas a imagen bajo demanda
  pdfjsLib.getDocument(pdfUrl).promise.then(async (pdf) => {
    const total = pdf.numPages;
    
    // Función para renderizar 1 página a PNG (canvas → dataURL)
    const renderPage = async (num) => {
      const page = await pdf.getPage(num);
      // Escala más pequeña para A4 vertical
      const viewport = page.getViewport({ scale: 1.2 });
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = viewport.width; 
      canvas.height = viewport.height;
      
      const renderContext = {
        canvasContext: ctx,
        viewport: viewport
      };
      
      await page.render(renderContext).promise;
      return canvas.toDataURL('image/png');
    };

    try {
      // Cargar TODAS las páginas primero
      loader.textContent = 'Cargando páginas...';
      
      for (let i = 1; i <= total; i++) {
        loader.textContent = `Cargando página ${i} de ${total}...`;
        const img = await renderPage(i);
        allImages.push(img);
      }

      // Inicializar PageFlip después de cargar todas las imágenes
      flip = new St.PageFlip(container, {
        width: 800,  // Ancho base para A4 vertical
        height: 1130, // Alto base para A4 (1.414 relación)
        size: "fixed", // Cambiar a fixed para mejor control del zoom
        showCover: true, 
        usePortrait: true, // IMPORTANTE: usar modo retrato
        flippingTime: 600, 
        maxShadowOpacity: 0.2,
        drawShadow: true,
        mobileScrollSupport: true,
        // Configuración para permitir redimensionado
        minWidth: 400,
        minHeight: 565,
        maxWidth: 2000,
        maxHeight: 2828,
        autoSize: false // Desactivar autoSize para control manual
      });

      // Cargar todas las imágenes al flipbook
      flip.loadFromImages(allImages);
      
      // Configurar controles
      setupZoomControls();
      setupDownloadButton();
      
      // Ocultar loader
      loader.style.display = 'none';

      // Controles de teclado mejorados
      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') flip.turnToNextPage();
        if (e.key === 'ArrowLeft') flip.turnToPrevPage();
        if ((e.key === '+' || e.key === '=') && !e.ctrlKey) {
          e.preventDefault();
          if (currentZoom < MAX_ZOOM) {
            currentZoom = Math.min(MAX_ZOOM, currentZoom + ZOOM_STEP);
            currentZoom = Math.round(currentZoom * 10) / 10;
            applyZoom();
          }
        }
        if ((e.key === '-' || e.key === '_') && !e.ctrlKey) {
          e.preventDefault();
          if (currentZoom > MIN_ZOOM) {
            currentZoom = Math.max(MIN_ZOOM, currentZoom - ZOOM_STEP);
            currentZoom = Math.round(currentZoom * 10) / 10;
            applyZoom();
          }
        }
        if (e.key === '0' && !e.ctrlKey) {
          currentZoom = 1;
          applyZoom();
        }
      });

      // Doble clic para resetear zoom
      container.addEventListener('dblclick', (e) => {
        e.preventDefault();
        e.stopPropagation();
        currentZoom = 1;
        applyZoom();
      });

      // Prevenir que el clic normal interfiera con el doble clic
      let clickTimer = null;
      container.addEventListener('click', (e) => {
        if (clickTimer) {
          clearTimeout(clickTimer);
          clickTimer = null;
          // Es un doble clic, ya manejado arriba
          return;
        }
        clickTimer = setTimeout(() => {
          clickTimer = null;
          // Cl simple - permitir cambio de página normal
        }, 300);
      });

      // Inicializar estado del zoom
      updateZoomDisplay();

    } catch (error) {
      loader.style.display = 'none';
      container.innerHTML = '<div style="padding:2rem;color:#e66">Error al renderizar páginas: ' + error.message + '</div>';
      console.error('Error:', error);
    }
  }).catch(err => {
    loader.style.display = 'none';
    container.innerHTML = '<div style="padding:2rem;color:#e66">No se pudo abrir el PDF: ' + err.message +
                          '<br>Comprueba el enlace o permisos de compartición.</div>';
    console.error('PDF Error:', err);
  });
})();
</script>
</body>
</html>
