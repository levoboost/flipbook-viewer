<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title id="doc-title">Visor</title>
  <style>
    html,body{height:100%;margin:0}
    #top{position:fixed;top:0;left:0;right:0;height:48px;background:#111;color:#fff;
         display:flex;align-items:center;padding:0 12px;font:500 14px/1.2 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;z-index:2}
    #pdf{position:fixed;top:48px;left:0;right:0;bottom:0;width:100%;height:calc(100% - 48px);border:0}
  </style>
</head>
<body>
  <div id="top"><span id="t"></span></div>
  <iframe id="pdf" allow="fullscreen"></iframe>

  <script>
    (function(){
      const p = new URLSearchParams(location.search);
      const src   = p.get('src') || '';
      const title = p.get('title') || '';

      if (title) {
        const txt = decodeURIComponent(title);
        document.getElementById('t').textContent = txt;
        document.title = txt;
      }

      // Cargar el PDF directamente (el navegador lo muestra sin más)
      document.getElementById('pdf').src = src;
    })();
  </script>
</body>
</html>
