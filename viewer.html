<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title id="doc-title">Visor (Flipbook)</title>

  <!-- PageFlip (solo JS; NO hay CSS en el paquete) -->
  https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js</script>

  <!-- PDF.js (librería + worker de la MISMA versión) -->
  https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js</script>
  <script>
    // Worker de PDF.js DE LA MISMA VERSIÓN (2.16.105)
    // (si no coinciden las versiones, PDF.js falla) 
    // Docs/listado de ficheros: https://cdnjs.com/libraries/pdf.js/2.16.105
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";
  </script>

  <style>
    :root { --header-h: 52px; }
    html, body { height: 100%; margin: 0; background: #0f1115; color: #fff; }
    .header {
      position: fixed; inset: 0 0 auto 0; height: var(--header-h);
      display: flex; align-items: center; gap: 12px;
      padding: 0 14px; background: #0b0d12; border-bottom: 1px solid #1c2230;
      font: 500 14px/1.2 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; z-index: 2;
    }
    .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .main  { position: fixed; inset: var(--header-h) 0 0 0; display: grid; place-items: center; }
    #flipbook { width: min(100vw, 1200px); height: calc(min(100vw, 1200px) * 1.4); }
    .hint { opacity: .8; font-size: 12px; margin-left: auto; }
    .loader {
      position: absolute; inset: 0; display: grid; place-items: center;
      background: #0f1115; z-index: 1; font: 500 14px system-ui, Segoe UI, Roboto; text-align: center;
    }
    .progress { margin-top: 8px; color: #b5c3ff; font-size: 12px; }
    a.btn { color: #9ecbff; text-decoration: none; border: 1px solid #2a3a5a; padding: 6px 10px;
            border-radius: 6px; background: #111725; }
    .diag {position:fixed; bottom:8px; left:8px; font-size:12px; opacity:.6}
  </style>
</head>
<body>
  <div class="header">
    <span class="title" id="t">Flipbook</span>
    <span class="hint">Sugerencia: arrastra o haz clic en las esquinas • Doble clic = zoom</span>
    <a id="openNative" class="btn" target="_blank" rel="noopener">Abrir PDF</a>
  </div>

  <div class="main">
    <div id="flipbook"></div>
    <div class="loader" id="loader">
      <div>
        <div>Generando formato revista…</div>
        <div class="progress" id="progress">0%</div>
      </div>
    </div>
  </div>

  <div class="diag" id="diag"></div>

  <script>
    (async function () {
      const diag = (m) => { const d = document.getElementById('diag'); d.textContent = m; };

      // Comprobación de librerías cargadas (visibles en pantalla si fallan)
      if (!window.pdfjsLib) { alert('No se ha cargado PDF.js'); diag('pdfjsLib: NO'); return; }
      if (!window.St || !window.St.PageFlip) { alert('No se ha cargado PageFlip'); diag('PageFlip: NO'); return; }
      diag('Librerías OK');

      const qs = new URLSearchParams(location.search);
      const srcEnc   = qs.get('src') || '';
      const titleEnc = qs.get('title') || '';

      const pdfUrl = srcEnc ? decodeURIComponent(srcEnc) : '';
      const title  = titleEnc ? decodeURIComponent(titleEnc) : 'Documento';

      document.getElementById('t').textContent = title;
      document.title = title;
      document.getElementById('openNative').href = pdfUrl || '#';

      if (!pdfUrl) {
        document.getElementById('loader').style.display = 'none';
        alert('Falta el parámetro "src" con la URL del PDF.');
        return;
      }

      try {
        // 1) Cargar PDF (tu Worker o una URL pública)
        const loadingTask = pdfjsLib.getDocument({ url: pdfUrl });
        const pdf = await loadingTask.promise;

        // 2) Medidas base (proporción de la primera página)
        const firstPage = await pdf.getPage(1);
        const firstViewport = firstPage.getViewport({ scale: 1 });
        const ratio = firstViewport.height / firstViewport.width;

        const maxW = Math.min(window.innerWidth, 1200);
        const pageW = Math.max(700, Math.floor(maxW * 0.9));
        const pageH = Math.floor(pageW * ratio);

        // 3) Render a imágenes
        const images = [];
        const progressEl = document.getElementById('progress');

        for (let n = 1; n <= pdf.numPages; n++) {
          const page = (n === 1) ? firstPage : await pdf.getPage(n);
          const viewport = page.getViewport({ scale: pageW / firstViewport.width });

          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          canvas.width = Math.floor(viewport.width);
          canvas.height = Math.floor(viewport.height);

          await page.render({ canvasContext: ctx, viewport }).promise;
          images.push(canvas.toDataURL('image/png'));

          progressEl.textContent = Math.round((n / pdf.numPages) * 100) + '%';
          canvas.width = canvas.height = 0;
        }

        // 4) PageFlip con imágenes
        const container = document.getElementById('flipbook');
        const pageFlip = new St.PageFlip(container, {
          width: pageW, height: pageH,
          size: 'stretch',
          maxShadowOpacity: 0.5,
          showCover: false,
          mobileScrollSupport: true,
          useMouseEvents: true,
          flippingTime: 700
        });

        pageFlip.loadFromImages(images);

        // 5) Oculta loader
        document.getElementById('loader').style.display = 'none';

        // Doble clic = zoom
        container.addEventListener('dblclick', () => {
          const current = container.style.transform || 'scale(1)';
          container.style.transform = current.includes('1)') ? 'scale(1.6)' : 'scale(1)';
          container.style.transformOrigin = '50% 50%';
        });

        // Resize
        window.addEventListener('resize', () => {
          const maxW2 = Math.min(window.innerWidth, 1200);
          container.style.width  = Math.min(maxW2, pageW) + 'px';
          container.style.height = Math.floor(Math.min(maxW2, pageW) * ratio) + 'px';
        });

      } catch (e) {
        document.getElementById('loader').style.display = 'none';
        alert('No se pudo generar el flipbook. Usa el botón "Abrir PDF".');
      }
    })();
  </script>
</body>
</html>
