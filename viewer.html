<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Flipbook Viewer</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/css/page-flip.css" />
<style>
  body {
    margin: 0;
    background: #111;
    color: #eee;
    font-family: system-ui, Segoe UI, Roboto, Arial;
    overflow: hidden;
  }
  header {
    padding: 10px 14px;
    background: #111;
    position: sticky;
    top: 0;
    z-index: 2;
    border-bottom: 1px solid #222;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #title {
    font-size: 16px;
    opacity: .85;
  }
  #header-controls {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .control-btn {
    background: #333;
    border: 1px solid #555;
    color: #eee;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
    transition: background 0.2s;
  }
  .control-btn:hover {
    background: #444;
  }
  .control-btn:active {
    background: #555;
  }
  #wrap {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    height: calc(100dvh - 52px);
    padding: 10px;
    overflow: auto;
  }
  #zoom-container {
    transform-origin: top center;
    transition: transform 0.3s ease;
    margin: 20px 0;
  }
  #book {
    width: 1000px;
    height: 1413px;
    position: relative;
  }
  .hint {
    position: fixed;
    bottom: 10px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 12px;
    color: #aaa;
    z-index: 1;
    background: rgba(0,0,0,0.7);
    padding: 5px;
  }
  #loader {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.8);
    padding: 20px;
    border-radius: 8px;
    color: white;
    z-index: 1000;
  }
  .zoom-controls {
    display: flex;
    gap: 5px;
    align-items: center;
  }
  .zoom-btn {
    background: #333;
    border: 1px solid #555;
    color: #eee;
    width: 30px;
    height: 30px;
    border-radius: 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
  }
  .zoom-btn:hover {
    background: #444;
  }
  .zoom-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .error-message {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.8);
    padding: 20px;
    border-radius: 8px;
    color: #e66;
    z-index: 1000;
    text-align: center;
  }
</style>
</head>
<body>
<header>
  <span id="title">Flipbook</span>
  <div id="header-controls">
    <div class="zoom-controls">
      <button class="zoom-btn" id="zoomOut" title="Zoom Out">-</button>
      <span id="zoomLevel" style="color:#eee; font-size:12px; min-width:40px; text-align:center;">50%</span>
      <button class="zoom-btn" id="zoomIn" title="Zoom In">+</button>
    </div>
    <button class="control-btn" id="downloadBtn" title="Descargar PDF">📥 Descargar</button>
  </div>
</header>
<div id="wrap">
  <div id="zoom-container">
    <div id="book"></div>
  </div>
</div>
<div class="hint">Usa ← → o clic en los bordes para pasar página. Scroll para navegar en zoom.</div>
<div id="loader">Cargando PDF...</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
<script>
(function() {
  const params = new URLSearchParams(location.search);
  const pdfUrl = params.get('src');
  const docTitle = params.get('title') || 'Documento';
  document.getElementById('title').textContent = '📖 ' + docTitle;

  if (!pdfUrl) {
    document.getElementById('loader').innerHTML = '<div class="error-message">Falta el parámetro <code>src</code> con la URL del PDF.</div>';
    return;
  }

  const container = document.getElementById('book');
  const zoomContainer = document.getElementById('zoom-container');
  const wrap = document.getElementById('wrap');
  const loader = document.getElementById('loader');
  let flip;
  
  let currentZoom = 0.5;
  const ZOOM_STEP = 0.25;
  const MIN_ZOOM = 0.5;
  const MAX_ZOOM = 3.0;

  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  let allImages = [];

  function applyZoom() {
    zoomContainer.style.transform = `scale(${currentZoom})`;
    updateZoomDisplay();
    setTimeout(() => { wrap.scrollTop = 0; }, 100);
  }

  function setupZoomControls() {
    const zoomIn = document.getElementById('zoomIn');
    const zoomOut = document.getElementById('zoomOut');
    zoomIn.addEventListener('click', () => {
      if (currentZoom < MAX_ZOOM) { currentZoom = Math.min(MAX_ZOOM, currentZoom + ZOOM_STEP); applyZoom(); }
    });
    zoomOut.addEventListener('click', () => {
      if (currentZoom > MIN_ZOOM) { currentZoom = Math.max(MIN_ZOOM, currentZoom - ZOOM_STEP); applyZoom(); }
    });
    document.getElementById('zoomLevel').addEventListener('dblclick', () => { currentZoom = 0.5; applyZoom(); });
  }

  function updateZoomDisplay() {
    const zoomLevel = document.getElementById('zoomLevel');
    zoomLevel.textContent = Math.round(currentZoom * 100) + '%';
    document.getElementById('zoomIn').disabled = currentZoom >= MAX_ZOOM;
    document.getElementById('zoomOut').disabled = currentZoom <= MIN_ZOOM;
  }

  function setupDownloadButton() {
    const downloadBtn = document.getElementById('downloadBtn');
    downloadBtn.addEventListener('click', async () => {
      try {
        downloadBtn.textContent = '⏳ Descargando...';
        downloadBtn.disabled = true;
        const response = await fetch(pdfUrl);
        if (!response.ok) throw new Error('Error en la descarga');
        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = "Informe.pdf"; a.click();
        window.URL.revokeObjectURL(url);
        downloadBtn.textContent = '✅ Descargado';
        setTimeout(() => { downloadBtn.textContent = '📥 Descargar'; downloadBtn.disabled = false; }, 2000);
      } catch {
        downloadBtn.textContent = '❌ Error';
        setTimeout(() => { downloadBtn.textContent = '📥 Descargar'; downloadBtn.disabled = false; }, 2000);
        alert('Error al descargar el PDF. Intente abrirlo directamente: ' + pdfUrl);
      }
    });
  }

  pdfjsLib.getDocument(pdfUrl).promise.then(async (pdf) => {
    const total = pdf.numPages;
    const renderPage = async (num) => {
      const page = await pdf.getPage(num);
      const viewport = page.getViewport({ scale: 1.5 });
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = viewport.width; canvas.height = viewport.height;
      await page.render({ canvasContext: ctx, viewport }).promise;
      return canvas.toDataURL('image/png');
    };

    loader.textContent = 'Cargando páginas...';
    for (let i = 1; i <= total; i++) {
      loader.textContent = `Cargando página ${i} de ${total}...`;
      allImages.push(await renderPage(i));
    }

    flip = new St.PageFlip(container, {
      width: 1000,
      height: 1413,
      size: "fixed",
      showCover: true, 
      usePortrait: true,
      flippingTime: 650,
      maxShadowOpacity: 0.35,
      drawShadow: true,
      mobileScrollSupport: false,
      autoSize: false,
      useMouseEvents: true,
      direction: "ltr",
      tilt: 0.02 // pequeña inclinación en ambas direcciones
    });

    flip.loadFromImages(allImages);
    setupZoomControls(); setupDownloadButton(); applyZoom();
    loader.style.display = 'none';

    // === EFECTO REALISTA DE RETROCESO (MISMA ANIMACIÓN QUE AVANZAR) ===
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') {
        e.preventDefault();
        flip.flipNext();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        // usar la misma esquina que usa el avance para que la animación sea visualmente idéntica
        const current = flip.getCurrentPageIndex();
        if (current > 0) {
          flip.flip(current - 1, 'bottom-right');
        }
      } else if (e.key === '+' || e.key === '=') {
        currentZoom = Math.min(MAX_ZOOM, currentZoom + ZOOM_STEP); applyZoom();
      } else if (e.key === '-' || e.key === '_') {
        currentZoom = Math.max(MIN_ZOOM, currentZoom - ZOOM_STEP); applyZoom();
      } else if (e.key === '0') {
        currentZoom = 0.5; applyZoom();
      }
    });

    // mismo efecto con clic en el borde izquierdo
    container.addEventListener('click', (e) => {
      const rect = container.getBoundingClientRect();
      if (e.clientX > rect.width * 0.6) flip.flipNext();
      else if (e.clientX < rect.width * 0.4) {
        const current = flip.getCurrentPageIndex();
        if (current > 0) flip.flip(current - 1, 'bottom-right');
      }
    });

  }).catch(() => {
    loader.innerHTML = '<div class="error-message"><h3>No ha podido cargarse el documento</h3></div>';
  });
})();
</script>
</body>
</html>
