<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Flipbook Viewer</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/css/page-flip.css" />
<style>
  body {
    margin: 0;
    background: #111;
    color: #eee;
    font-family: system-ui, Segoe UI, Roboto, Arial;
    overflow: hidden;
  }
  header {
    padding: 10px 14px;
    background: #111;
    position: sticky;
    top: 0;
    z-index: 2;
    border-bottom: 1px solid #222;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #title {
    font-size: 16px;
    opacity: .85;
  }
  #header-controls {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .control-btn {
    background: #333;
    border: 1px solid #555;
    color: #eee;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
    transition: background 0.2s;
  }
  .control-btn:hover {
    background: #444;
  }
  .control-btn:active {
    background: #555;
  }
  #wrap {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    height: calc(100dvh - 52px);
    padding: 10px;
    overflow: auto;
  }
  #zoom-container {
    transform-origin: top center;
    transition: transform 0.3s ease;
    margin: 20px 0;
  }
  #book {
    width: 1000px;
    height: 1413px;
    position: relative;
  }
  .hint {
    position: fixed;
    bottom: 10px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 12px;
    color: #aaa;
    z-index: 1;
    background: rgba(0,0,0,0.7);
    padding: 5px;
  }
  #loader {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.8);
    padding: 20px;
    border-radius: 8px;
    color: white;
    z-index: 1000;
  }
  .zoom-controls {
    display: flex;
    gap: 5px;
    align-items: center;
  }
  .zoom-btn {
    background: #333;
    border: 1px solid #555;
    color: #eee;
    width: 30px;
    height: 30px;
    border-radius: 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
  }
  .zoom-btn:hover {
    background: #444;
  }
  .zoom-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
</style>
</head>
<body>
<header>
  <span id="title">Flipbook</span>
  <div id="header-controls">
    <div class="zoom-controls">
      <button class="zoom-btn" id="zoomOut" title="Zoom Out">-</button>
      <span id="zoomLevel" style="color:#eee; font-size:12px; min-width:40px; text-align:center;">75%</span>
      <button class="zoom-btn" id="zoomIn" title="Zoom In">+</button>
    </div>
    <button class="control-btn" id="downloadBtn" title="Descargar PDF">📥 Descargar</button>
  </div>
</header>
<div id="wrap">
  <div id="zoom-container">
    <div id="book"></div>
  </div>
</div>
<div class="hint">Usa ← → o clic en los bordes para pasar página. Scroll para navegar en zoom.</div>
<div id="loader">Cargando PDF...</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
<script>
(function() {
  const params = new URLSearchParams(location.search);
  const pdfUrl = params.get('src');
  const docTitle = params.get('title') || 'Documento';
  document.getElementById('title').textContent = '📖 ' + docTitle;

  if (!pdfUrl) {
    document.getElementById('book').innerHTML =
      '<div style="padding:2rem">Falta el parámetro <code>src</code> con la URL del PDF.</div>';
    document.getElementById('loader').style.display = 'none';
    return;
  }

  const container = document.getElementById('book');
  const zoomContainer = document.getElementById('zoom-container');
  const wrap = document.getElementById('wrap');
  const loader = document.getElementById('loader');
  let flip;
  
  let currentZoom = 0.75;
  const ZOOM_STEP = 0.25;
  const MIN_ZOOM = 0.5;
  const MAX_ZOOM = 3.0;

  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  let allImages = [];

  function applyZoom() {
    zoomContainer.style.transform = `scale(${currentZoom})`;
    updateZoomDisplay();
    setTimeout(() => {
      wrap.scrollTop = 0;
    }, 100);
  }

  function setupZoomControls() {
    const zoomIn = document.getElementById('zoomIn');
    const zoomOut = document.getElementById('zoomOut');

    zoomIn.addEventListener('click', () => {
      if (currentZoom < MAX_ZOOM) {
        currentZoom = Math.min(MAX_ZOOM, currentZoom + ZOOM_STEP);
        currentZoom = Math.round(currentZoom * 100) / 100;
        applyZoom();
      }
    });

    zoomOut.addEventListener('click', () => {
      if (currentZoom > MIN_ZOOM) {
        currentZoom = Math.max(MIN_ZOOM, currentZoom - ZOOM_STEP);
        currentZoom = Math.round(currentZoom * 100) / 100;
        applyZoom();
      }
    });

    const zoomLevel = document.getElementById('zoomLevel');
    zoomLevel.addEventListener('dblclick', () => {
      currentZoom = 0.75;
      applyZoom();
    });
  }

  function updateZoomDisplay() {
    const zoomLevel = document.getElementById('zoomLevel');
    zoomLevel.textContent = Math.round(currentZoom * 100) + '%';
    document.getElementById('zoomIn').disabled = currentZoom >= MAX_ZOOM;
    document.getElementById('zoomOut').disabled = currentZoom <= MIN_ZOOM;
  }

  function setupDownloadButton() {
    const downloadBtn = document.getElementById('downloadBtn');
    
    downloadBtn.addEventListener('click', async () => {
      try {
        downloadBtn.textContent = '⏳ Descargando...';
        downloadBtn.disabled = true;
        
        const response = await fetch(pdfUrl);
        if (!response.ok) throw new Error('Error en la descarga');
        const blob = await response.blob();
        
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = "Informe_Estrategico_IA_Comercial.pdf";
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        document.body.removeChild(a);
        
        downloadBtn.textContent = '✅ Descargado';
        setTimeout(() => {
          downloadBtn.textContent = '📥 Descargar';
          downloadBtn.disabled = false;
        }, 2000);
        
      } catch (error) {
        console.error('Error al descargar:', error);
        downloadBtn.textContent = '❌ Error';
        setTimeout(() => {
          downloadBtn.textContent = '📥 Descargar';
          downloadBtn.disabled = false;
        }, 2000);
        alert('Error al descargar el PDF. Puede intentar descargarlo directamente desde: ' + pdfUrl);
      }
    });
  }

  pdfjsLib.getDocument(pdfUrl).promise.then(async (pdf) => {
    const total = pdf.numPages;
    
    const renderPage = async (num) => {
      const page = await pdf.getPage(num);
      const viewport = page.getViewport({ scale: 1.5 });
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = viewport.width; 
      canvas.height = viewport.height;
      
      const renderContext = {
        canvasContext: ctx,
        viewport: viewport
      };
      
      await page.render(renderContext).promise;
      return canvas.toDataURL('image/png');
    };

    try {
      loader.textContent = 'Cargando páginas...';
      
      for (let i = 1; i <= total; i++) {
        loader.textContent = `Cargando página ${i} de ${total}...`;
        const img = await renderPage(i);
        allImages.push(img);
      }

      // CONFIGURACIÓN SIMPLIFICADA Y FUNCIONAL
      flip = new St.PageFlip(container, {
        width: 1000,
        height: 1413,
        size: "fixed",
        showCover: true, 
        usePortrait: true,
        flippingTime: 600,
        maxShadowOpacity: 0.3,
        drawShadow: true,
        mobileScrollSupport: false,
        minWidth: 1000,
        minHeight: 1413,
        maxWidth: 1000,
        maxHeight: 1413,
        autoSize: false
      });

      flip.loadFromImages(allImages);
      
      // CONFIGURAR CONTROLES DESPUÉS DE CARGAR
      setupZoomControls();
      setupDownloadButton();
      applyZoom();
      loader.style.display = 'none';

      // CONTROL DE TECLADO - MÉTODO DIRECTO QUE FUNCIONA
      document.addEventListener('keydown', (e) => {
        // Flecha derecha - Página siguiente
        if (e.key === 'ArrowRight') {
          e.preventDefault();
          // Usar turnToNextPage que es más confiable
          flip.turnToNextPage();
        }
        // Flecha izquierda - Página anterior
        else if (e.key === 'ArrowLeft') {
          e.preventDefault();
          flip.turnToPrevPage();
        }
        // Controles de zoom
        else if ((e.key === '+' || e.key === '=') && !e.ctrlKey) {
          e.preventDefault();
          if (currentZoom < MAX_ZOOM) {
            currentZoom = Math.min(MAX_ZOOM, currentZoom + ZOOM_STEP);
            currentZoom = Math.round(currentZoom * 100) / 100;
            applyZoom();
          }
        }
        else if ((e.key === '-' || e.key === '_') && !e.ctrlKey) {
          e.preventDefault();
          if (currentZoom > MIN_ZOOM) {
            currentZoom = Math.max(MIN_ZOOM, currentZoom - ZOOM_STEP);
            currentZoom = Math.round(currentZoom * 100) / 100;
            applyZoom();
          }
        }
        else if (e.key === '0' && !e.ctrlKey) {
          currentZoom = 0.75;
          applyZoom();
        }
      });

      // CLIC EN BORDES - DEJAR QUE PAGEFLIP MANEJE LA NAVEGACIÓN
      // No interferir con el sistema de clics nativo de PageFlip

      // DOBLE CLIC PARA ZOOM
      container.addEventListener('dblclick', (e) => {
        e.preventDefault();
        e.stopPropagation();
        currentZoom = 0.75;
        applyZoom();
      });

      updateZoomDisplay();

      // DEBUG: Verificar que PageFlip está funcionando
      console.log('PageFlip cargado:', flip);
      console.log('Número de páginas:', allImages.length);

    } catch (error) {
      loader.style.display = 'none';
      container.innerHTML = '<div style="padding:2rem;color:#e66">Error al renderizar páginas: ' + error.message + '</div>';
      console.error('Error:', error);
    }
  }).catch(err => {
    loader.style.display = 'none';
    container.innerHTML = '<div style="padding:2rem;color:#e66">No se pudo abrir el PDF: ' + err.message +
                          '<br>Comprueba el enlace o permisos de compartición.</div>';
    console.error('PDF Error:', err);
  });
})();
</script>
</body>
</html>
