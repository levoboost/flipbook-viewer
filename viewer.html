<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Flipbook Viewer</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/css/page-flip.css" />
<style>
  body {
    margin: 0;
    background: #111;
    color: #eee;
    font-family: system-ui, Segoe UI, Roboto, Arial;
  }
  header {
    padding: 10px 14px;
    background: #111;
    position: sticky;
    top: 0;
    z-index: 2;
    border-bottom: 1px solid #222;
  }
  #title {
    font-size: 16px;
    opacity: .85;
  }
  #wrap {
    display: flex;
    justify-content: center;
    align-items: stretch;
    height: calc(100dvh - 52px);
    padding: 10px;
  }
  #book {
    width: min(100%, 1200px);
    height: 100%;
  }
  .hint {
    position: fixed;
    bottom: 10px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 12px;
    color: #aaa;
  }
  #loader {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.8);
    padding: 20px;
    border-radius: 8px;
    color: white;
    z-index: 1000;
  }
</style>
</head>
<body>
<header><span id="title">Flipbook</span></header>
<div id="wrap"><div id="book"></div></div>
<div class="hint">Usa ← → o clic para pasar página. Doble clic para zoom.</div>
<div id="loader" style="display:none;">Cargando PDF...</div>

<!-- Usar versión estable de PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
<script>
(function() {
  // Lee ?src= (PDF) y ?title= del querystring
  const params = new URLSearchParams(location.search);
  const pdfUrl = params.get('src');
  const docTitle = params.get('title') || 'Documento';
  document.getElementById('title').textContent = '📖 ' + docTitle;

  if (!pdfUrl) {
    document.getElementById('book').innerHTML =
      '<div style="padding:2rem">Falta el parámetro <code>src</code> con la URL del PDF.</div>';
    return;
  }

  const container = document.getElementById('book');
  const loader = document.getElementById('loader');
  
  // Mostrar loader
  loader.style.display = 'block';

  // Configurar PDF.js
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  // Usar St.PageFlip que es el nombre correcto en esta versión
  const flip = new St.PageFlip(container, {
    size: "stretch",
    width: 1024, 
    height: 700,
    showCover: true, 
    usePortrait: true,
    flippingTime: 600, 
    maxShadowOpacity: 0.2,
    drawShadow: true,
    mobileScrollSupport: true
  });

  // Carga y renderiza páginas a imagen bajo demanda
  pdfjsLib.getDocument(pdfUrl).promise.then(async (pdf) => {
    const total = pdf.numPages;
    const imgs = [];

    // Función para renderizar 1 página a PNG (canvas → dataURL)
    const renderPage = async (num) => {
      const page = await pdf.getPage(num);
      // Ajusta escala si quieres más/menos detalle
      const viewport = page.getViewport({ scale: 1.4 });
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = viewport.width; 
      canvas.height = viewport.height;
      
      const renderContext = {
        canvasContext: ctx,
        viewport: viewport
      };
      
      await page.render(renderContext).promise;
      return canvas.toDataURL('image/png');
    };

    try {
      // Carga inicial rápida: 1–2 páginas
      const first = await renderPage(1);
      imgs.push(first);
      if (total >= 2) {
        const second = await renderPage(2);
        imgs.push(second);
      }
      
      flip.loadFromImages(imgs);
      
      // Ocultar loader cuando se cargan las primeras páginas
      loader.style.display = 'none';

      // Resto en segundo plano
      if (total > 2) {
        for (let i = 3; i <= total; i++) {
          renderPage(i).then(img => {
            // Agregar la nueva imagen y actualizar
            const currentImages = [...flip.images];
            currentImages.push(img);
            flip.loadFromImages(currentImages);
          }).catch(err => {
            console.error('Error cargando página', i, err);
          });
        }
      }

      // Controles de teclado mejorados
      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') flip.turnToNextPage();
        if (e.key === 'ArrowLeft') flip.turnToPrevPage();
        if (e.key === '+') flip.zoomIn();
        if (e.key === '-') flip.zoomOut();
        if (e.key === '0') flip.setZoom(1); // Reset zoom
      });

      // Doble clic para zoom (toggle)
      container.addEventListener('dblclick', (e) => {
        if (flip.getZoom() > 1) {
          flip.setZoom(1);
        } else {
          flip.zoomIn();
        }
      });

    } catch (error) {
      loader.style.display = 'none';
      container.innerHTML = '<div style="padding:2rem;color:#e66">Error al renderizar páginas: ' + error.message + '</div>';
      console.error('Error:', error);
    }
  }).catch(err => {
    loader.style.display = 'none';
    container.innerHTML = '<div style="padding:2rem;color:#e66">No se pudo abrir el PDF: ' + err.message +
                          '<br>Comprueba el enlace o permisos de compartición.' +
                          '<br>Error detallado: ' + JSON.stringify(err) + '</div>';
    console.error('PDF Error:', err);
  });
})();
</script>
</body>
</html>
