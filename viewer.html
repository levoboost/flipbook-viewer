<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flipbook Viewer</title>

  <style>
    :root {
      --bg: #0f1115;
      --fg: #e8eaed;
      --muted: #9097a3;
      --accent: #4ea1ff;
      --error: #ff6b6b;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: .75rem 1rem;
      background: rgba(20,22,28,0.85);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid #1c2030;
    }
    .toolbar input {
      flex: 1;
      min-width: 0;
      padding: .5rem .75rem;
      border: 1px solid #2a3142;
      background: #12141a;
      color: var(--fg);
      border-radius: .5rem;
      outline: none;
    }
    .toolbar button {
      padding: .5rem .9rem;
      border: 1px solid #2a3142;
      background: #182033;
      color: var(--fg);
      border-radius: .5rem;
      cursor: pointer;
    }
    .toolbar button:hover { background: #1d2740; }

    #stage {
      position: relative;
      width: 100%;
      height: calc(100vh - 56px);
      overflow: hidden;
      display: grid;
      place-items: center;
    }
    #flipbook {
      width: min(100vw, 1200px);
      height: calc(min(100vw, 1200px) * 0.70);
    }

    #loader {
      position: fixed;
      inset: 0;
      background: radial-gradient(1200px 600px at 50% 0%, rgba(78,161,255,0.06), transparent),
                  linear-gradient(#0f1115, #0f1115);
      display: grid;
      place-items: center;
      z-index: 1000;
      transition: opacity .25s ease;
    }
    #loader.hidden { opacity: 0; pointer-events: none; }
    .progress { text-align: center; }
    .progress .big {
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: .02em;
      color: var(--fg);
    }
    .progress .small {
      margin-top: .35rem;
      font-size: .95rem;
      color: var(--muted);
    }

    #errorBox {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      max-width: min(90vw, 900px);
      background: #2a1320;
      border: 1px solid #5a1b2f;
      color: #ffd5de;
      padding: .9rem 1rem;
      border-radius: .6rem;
      display: none;
      z-index: 1100;
      white-space: pre-wrap;
      line-height: 1.35;
    }

    .hint { font-size: .85rem; color: var(--muted); margin-left: .25rem; }

    @media (max-width: 700px) {
      #flipbook {
        width: 100vw;
        height: calc(100vh - 56px);
      }
    }
  </style>

  <!-- PageFlip (flipbook) - local -->
  libs/page-flip/page-flip.browser.min.js</script>

  <!-- PDF.js (núcleo) - local -->
  libs/pdfjs/pdf.min.js</script>

  <!-- Configura el worker de PDF.js (debe ir DESPUÉS de cargar pdf.min.js) -->
  <script>
    (function() {
      if (window.pdfjsLib) {
        pdfjsLib.GlobalWorkerOptions.workerSrc = "libs/pdfjs/pdf.worker.min.js";
        console.log("[init] PDF.js ok. Worker:", pdfjsLib.GlobalWorkerOptions.workerSrc);
      } else {
        console.error("[init] pdfjsLib no está cargado. Revisa la ruta: libs/pdfjs/pdf.min.js");
      }
      console.log("[diag] typeof PageFlip:", typeof (window.St && St.PageFlip));
      console.log("[diag] typeof pdfjsLib:", typeof window.pdfjsLib);
    })();
  </script>
</head>

<body>
  <div class="toolbar">
    <strong>Flipbook Viewer</strong>
    <span class="hint">Usa <code>?pdf=</code> en la URL o escribe un PDF aquí:</span>
    <input id="pdfInput" type="text" placeholder="ej.: test.pdf o URL completa" />
    <button id="btnLoad">Cargar</button>
  </div>

  <div id="stage">
    <div id="flipbook" aria-label="Flipbook container"></div>
  </div>

  <!-- Loader -->
  <div id="loader" role="status" aria-live="polite">
    <div class="progress">
      <div class="big" id="percent">0%</div>
      <div class="small" id="status">Cargando PDF...</div>
    </div>
  </div>

  <!-- Mensajes de error -->
  <div id="errorBox"></div>

  <script>
    (function() {
      const $ = (q) => document.querySelector(q);
      const qs = (name) => new URLSearchParams(location.search).get(name);

      const flipContainer = $("#flipbook");
      const loader = $("#loader");
      const percentEl = $("#percent");
      const statusEl = $("#status");
      const errorBox = $("#errorBox");
      const input = $("#pdfInput");
      const btn = $("#btnLoad");

      const defaultPdf = "test.pdf";
      const paramPdf = qs("pdf");
      const initialPdf = paramPdf ? decodeURIComponent(paramPdf) : defaultPdf;
      input.value = initialPdf;

      function showError(msg) {
        console.error(msg);
        errorBox.textContent = String(msg);
        errorBox.style.display = "block";
      }
      function hideError() { errorBox.style.display = "none"; }

      function showLoader(text) {
        if (text) statusEl.textContent = text;
        loader.classList.remove("hidden");
      }
      function updateProgress(loaded, total) {
        if (!total) { percentEl.textContent = "…"; return; }
        const p = Math.max(0, Math.min(100, Math.round((loaded / total) * 100)));
        percentEl.textContent = p + "%";
      }
      function hideLoader() { loader.classList.add("hidden"); }

      async function loadFlipbook(pdfUrl) {
        hideError();
        showLoader("Cargando PDF...");

        if (!window.pdfjsLib) {
          hideLoader();
          showError("No se pudo cargar/renderizar el PDF:\npdfjsLib no está disponible. Verifica que 'libs/pdfjs/pdf.min.js' existe y se carga sin 404.");
          return;
        }
        if (!(window.St && St.PageFlip)) {
          console.warn("PageFlip no disponible aún. Revisa 'libs/page-flip/page-flip.browser.min.js'.");
        }

        let loadingTask;
        try {
          loadingTask = pdfjsLib.getDocument({ url: pdfUrl });
          loadingTask.onProgress = (p) => updateProgress(p.loaded || 0, p.total || 0);

          const pdf = await loadingTask.promise;
          statusEl.textContent = "Renderizando páginas...";
          const images = [];
          const pageCount = pdf.numPages;
          const SCALE = 1.6;

          for (let n = 1; n <= pageCount; n++) {
            statusEl.textContent = `Renderizando página ${n} de ${pageCount}...`;
            percentEl.textContent = Math.round((n - 1) / pageCount * 100) + "%";

            const page = await pdf.getPage(n);
            const viewport = page.getViewport({ scale: SCALE });

            const canvas = document.createElement("canvas");
            const ctx = canvas.getContext("2d");

            canvas.width = Math.floor(viewport.width);
            canvas.height = Math.floor(viewport.height);

            await page.render({ canvasContext: ctx, viewport }).promise;

            const dataUrl = canvas.toDataURL("image/png");
            images.push(dataUrl);
          }

          statusEl.textContent = "Preparando flipbook...";
          flipContainer.innerHTML = "";

          // Determina tamaño a partir de la primera imagen
          const imgProbe = new Image();
          await new Promise((res) => { imgProbe.onload = res; imgProbe.onerror = res; imgProbe.src = images[0]; });
          const baseWidth = imgProbe.naturalWidth || 1000;
          const baseHeight = imgProbe.naturalHeight || 1414;

          // Inicializa PageFlip
          const pageFlip = new St.PageFlip(flipContainer, {
            width: baseWidth,
            height: baseHeight,
            size: "stretch",
            minWidth: 315,
            minHeight: 420,
            maxWidth: 3000,
            maxHeight: 4000,
            showCover: false,
            mobileScrollSupport: true,
            usePortrait: true,
            disableFlipByClick: false,
            flippingTime: 600,
            maxShadowOpacity: 0.3,
            drawShadow: true,
            autoSize: true,
            startPage: 0,
          });

          pageFlip.loadFromImages(images);

          hideLoader();
          console.log("[ok] Flipbook listo con", images.length, "páginas.");

        } catch (err) {
          hideLoader();
          const hint = (String(err).includes("CORS") || String(err).includes("Network"))
            ? "\n\nSugerencia: Si el PDF está en otro dominio (p.ej., SharePoint) puede bloquearse por CORS al abrirse desde GitHub Pages. Para la demo usa un PDF local (test.pdf)."
            : "";
          showError("No se pudo cargar/renderizar el PDF:\n" + (err && err.message ? err.message : String(err)) + hint);
        } finally {
          try { loadingTask && loadingTask.destroy && loadingTask.destroy(); } catch {}
        }
      }

      btn.addEventListener("click", () => {
        const url = input.value.trim();
        if (!url) { showError("Indica la ruta del PDF (ej.: test.pdf)."); return; }
        const u = new URL(location.href);
        u.searchParams.set("pdf", url);
        u.searchParams.set("v", Date.now().toString().slice(-6));
        location.href = u.toString();
      });

      loadFlipbook(initialPdf);
    })();
  </script>
</body>
</html>
``
