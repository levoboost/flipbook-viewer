<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flipbook Viewer</title>

  <style>
    html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: #0f1115; color: #e8eaed; }
    #toolbar { display: flex; gap: .5rem; align-items: center; padding: .6rem .8rem; border-bottom: 1px solid #22293a; position: sticky; top: 0; background: #0f1115; z-index: 10; }
    #toolbar input { flex: 1; min-width: 0; padding: .45rem .6rem; border: 1px solid #2a3142; background: #12141a; color: #e8eaed; border-radius: .4rem; }
    #toolbar button { padding: .45rem .75rem; border: 1px solid #2a3142; background: #182033; color: #e8eaed; border-radius: .4rem; cursor: pointer; }
    #stage { height: calc(100vh - 54px); display: grid; place-items: center; overflow: hidden; }
    #flipbook { width: min(100vw, 1200px); height: calc(min(100vw, 1200px) * 0.70); }
    #loader { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(15,17,21,.9); z-index: 999; }
    #loader.hidden { opacity: 0; pointer-events: none; transition: opacity .2s ease; }
    #percent { font-size: 2rem; font-weight: 700; }
    #error { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); background: #2a1320; border: 1px solid #5a1b2f; color: #ffd5de; padding: .7rem .9rem; border-radius: .5rem; display: none; white-space: pre-wrap; z-index: 1000; }
  </style>

  <!-- ✅ Librerías locales (AHORA SÍ con src="...") -->
  <script src="flipbook-viewer/libs/pdfjs/pdf.min.js"></pt>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = "flipbook-viewer/libs/pdfjs/pdf.worker.min.js";
      console.log("[init] PDF.js listo. Worker:", pdfjsLib.GlobalWorkerOptions.workerSrc);
    } else {
      console.error("[init] pdfjsLib no cargado — revisa flipbook-viewer/libs/pdfjs/pdf.min.js");
    }
  </script>
  <script src="flipibs/page-flip/page-flip.browser.min.js</script>
</head>
<body>
  <div id="toolbar">
    <strong>Flipbook</strong>
    <input id="pdfInput" type="text" placeholder="URL o nombre del PDF (ej.: test.pdf)" />
    <button id="btnLoad">Cargar</button>
  </div>

  <div id="stage"><div id="flipbook" aria-label="Flipbook container"></div></div>

  <div id="loader"><div style="text-align:center">
    <div id="percent">0%</div>
    <div id="status">Cargando PDF…</div>
  </div></div>

  <div id="error"></div>

  <script>
  (function(){
    const $ = s => document.querySelector(s);
    const qs = name => new URLSearchParams(location.search).get(name);
    const show = (el, text) => { el.textContent = text || el.textContent; el.style.display = "block"; };
    const hide = (el) => el.style.display = "none";

    const loader = $("#loader"), percent = $("#percent"), statusEl = $("#status");
    const flipEl = $("#flipbook"), errorEl = $("#error");
    const input = $("#pdfInput"), btn = $("#btnLoad");

    // Soporta ?src= (prioridad, como tu URL) y ?pdf=
    const pSrc = qs("src");
    const pPdf = qs("pdf");
    const title = qs("title");
    if (title) document.title = title;
    const initialPdf = (pSrc && decodeURIComponent(pSrc)) || (pPdf && decodeURIComponent(pPdf)) || "test.pdf";
    input.value = initialPdf;

    function setProgress(loaded, total){
      if (!total) { percent.textContent = "…"; return; }
      percent.textContent = Math.max(0, Math.min(100, Math.round(loaded/total*100))) + "%";
    }
    function fail(msg){
      hide(loader);
      errorEl.textContent = msg;
      show(errorEl);
      console.error(msg);
    }

    async function load(pdfUrl){
      hide(errorEl);
      loader.classList.remove("hidden");

      if (!window.pdfjsLib) { fail("No se pudo cargar/renderizar el PDF:\npdfjsLib no está disponible. Verifica 'flipbook-viewer/libs/pdfjs/pdf.min.js' (sin 404)."); return; }
      if (!(window.St && St.PageFlip)) { console.warn("PageFlip no disponible. Revisa 'flipbook-viewer/libs/page-flip/page-flip.browser.min.js'."); }

      let task;
      try {
        statusEl.textContent = "Descargando PDF…";
        task = pdfjsLib.getDocument({ url: pdfUrl });
        task.onProgress = p => setProgress(p.loaded||0, p.total||0);
        const pdf = await task.promise;

        statusEl.textContent = "Renderizando páginas…";
        const images = [];
        const SCALE = 1.6;

        for (let i = 1; i <= pdf.numPages; i++){
          statusEl.textContent = `Renderizando página ${i} de ${pdf.numPages}…`;
          percent.textContent = Math.round((i-1)/pdf.numPages*100) + "%";
          const page = await pdf.getPage(i);
          const viewport = page.getViewport({ scale: SCALE });
          const canvas = document.createElement("canvas");
          const ctx = canvas.getContext("2d");
          canvas.width = Math.floor(viewport.width);
          canvas.height = Math.floor(viewport.height);
          await page.render({ canvasContext: ctx, viewport }).promise;
          images.push(canvas.toDataURL("image/png"));
        }

        statusEl.textContent = "Preparando flipbook…";
        flipEl.innerHTML = "";

        const probe = new Image();
        await new Promise(res => { probe.onload = res; probe.onerror = res; probe.src = images[0]; });
        const w = probe.naturalWidth || 1000, h = probe.naturalHeight || 1414;

        const pageFlip = new St.PageFlip(flipEl, {
          width: w, height: h, size: "stretch",
          minWidth: 315, minHeight: 420, maxWidth: 3000, maxHeight: 4000,
          showCover: false, mobileScrollSupport: true, usePortrait: true,
          disableFlipByClick: false, flippingTime: 600, maxShadowOpacity: .3, drawShadow: true, autoSize: true
        });
        pageFlip.loadFromImages(images);

        loader.classList.add("hidden");
      } catch (e){
        const hint = (String(e).includes("CORS") || String(e).includes("Network"))
          ? "\n\nSugerencia: si el PDF está en otro dominio, puede requerir CORS. Para descartar, prueba con un PDF local (p.ej., test.pdf)."
          : "";
        fail("No se pudo cargar/renderizar el PDF:\n" + (e && e.message ? e.message : String(e)) + hint);
      } finally {
        try { task && task.destroy && task.destroy(); } catch {}
      }
    }

    btn.addEventListener("click", () => {
      const url = input.value.trim();
      if (!url) { fail("Indica la ruta del PDF (ej.: test.pdf)."); return; }
      const u = new URL(location.href);
      u.searchParams.set("src", url);
      u.searchParams.set("v", Date.now().toString().slice(-6)); // evita caché
      location.href = u.toString();
    });

    load(initialPdf);
  })();
  </script>
</body>
</html>
